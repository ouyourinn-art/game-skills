<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinwheel Rows icon</title>
<link rel="stylesheet" href="../www/style.css">
<script src="../www/game.js"></script>
<style>
  html, body { width: 512px; height: 512px; overflow: hidden; background: #84bf63; }
  .stage { position: relative; width: 512px; height: 512px; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .bed { position: absolute; left: 34px; top: 34px; width: 444px; height: 444px; padding: 20px; border: 5px solid var(--wood-dark); border-radius: 46px; background-color: var(--wood);
    background-image: repeating-linear-gradient(90deg, rgba(60, 30, 10, 0.2) 0 3px, transparent 3px 61px),
      repeating-linear-gradient(90deg, rgba(255, 236, 200, 0.12) 0 4px, transparent 4px 21px),
      repeating-linear-gradient(0deg, rgba(90, 50, 20, 0.1) 0 1px, transparent 1px 8px);
    box-shadow: 0 9px 0 #6a4022, 0 18px 26px rgba(30, 50, 20, 0.45); }
  .soil { position: relative; width: 100%; height: 100%; border-radius: 28px; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    background-color: var(--soil);
    background-image: radial-gradient(circle, rgba(255, 228, 196, 0.13) 1.6px, transparent 2.2px), radial-gradient(circle, rgba(0, 0, 0, 0.22) 1.8px, transparent 2.4px);
    background-size: 11px 11px, 15px 15px; background-position: 0 0, 6px 7px;
    box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.4); }
  .soil .tile { width: auto; height: auto; border-width: 4px; border-radius: 22%; }
  .big-wheel { position: absolute; left: 176px; top: 176px; width: 160px; height: 160px; border-radius: 50%; background: #fff; border: 8px solid #35506b;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 18px rgba(30, 50, 70, 0.45); }
</style>
</head>
<body>
<div class="stage">
  <div class="layer" id="lawn"></div>
  <div class="bed"><div class="soil" id="soil"></div></div>
  <div class="big-wheel" id="wheel"></div>
</div>
<script>
  document.getElementById("lawn").innerHTML = gardenSVG(512, 512, 3, { hedge: false, border: false, sticks: false });
  const soil = document.getElementById("soil");
  for (const k of [0, 1, 1, 0]) {
    const cell = document.createElement("div");
    cell.className = "tile";
    cell.style.background = FLOWERS[k].tile;
    cell.innerHTML = flowerSVG(k, 128);
    soil.appendChild(cell);
  }
  // a coloured pinwheel: one blade per flower
  const blades = FLOWERS.map((f, i) => `<path d="M32 32 L32 5 Q48 10 32 32 Z" transform="rotate(${20 + i * 90} 32 32)" fill="${f.fill}" stroke="#35506b" stroke-width="2.6" stroke-linejoin="round"/>`).join("");
  document.getElementById("wheel").innerHTML = `<svg viewBox="0 0 64 64" width="138" height="138">${blades}<circle cx="32" cy="32" r="5.5" fill="#35506b"/></svg>`;
</script>
</body>
</html>
